name: Ecosystem Proof

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_http_smoke:
        description: Run protected non-mutating HTTP smoke checks
        required: true
        type: boolean
        default: false
      environment:
        description: Non-production proof environment
        required: true
        type: choice
        options:
          - staging
          - review
          - production
        default: staging

jobs:
  static-proof:
    name: Static ecosystem proof
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      # Nested apps are independent private repositories, ignored by the root.
      # The unchanged static proof needs their source, not builds or live access.
      - name: Verify exact private source access without retries
        timeout-minutes: 2
        env:
          SOURCE_READ_TOKEN: ${{ secrets.ECOSYSTEM_APP_REPO_READ_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.error, urllib.request

          PINS = [('craftyguru/xflowx', '7990e5cd2c271fb79aaeebc0887b62b776c10f0e'), ('craftyguru/verixet', 'cea5f5b74cc9f5f6d946e2e2fd33bb317b9fb20f'), ('craftyguru/Rataify', '9078e28ec3e19563fbf3754955d733083f8a2e82'), ('craftyguru/AudAiX', '0c07ac6ecd8ba52172a6ce71a4a6f6d1e621f5a0'), ('craftyguru/WordGeni', 'd7ced489a249500d10f6e0b1a5bf988b39d8c05f'), ('craftyguru/Crevux', '7b0a87ce6e360b9ee8142c028cea691be2095a46')]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def verify(token, read):
              if not token or token != token.strip() or any(c.isspace() for c in token):
                  return [{"result": "MISSING_OR_MALFORMED_SOURCE_CREDENTIAL"}]
              results = []
              for repository, expected in PINS:
                  url = f"https://api.github.com/repos/{repository}/git/commits/{expected}"
                  try:
                      status, headers, payload = read(url, token)
                      reason = "PASS" if status == 200 and payload.get("sha") == expected else {
                          401: "CREDENTIAL_REJECTED",
                          403: "SOURCE_PERMISSION_OR_POLICY_DENIED",
                          404: "SOURCE_ACCESS_OR_REF_UNAVAILABLE",
                      }.get(status, "SOURCE_PREFLIGHT_FAILED")
                      if status == 200 and payload.get("sha") != expected:
                          reason = "SOURCE_SHA_MISMATCH"
                      row = {"repository": repository, "expected": expected,
                             "httpStatus": status, "result": reason,
                             "ssoRequired": bool(headers.get("X-GitHub-SSO"))}
                  except Exception as error:
                      row = {"repository": repository, "result": "SOURCE_TRANSPORT_FAILED",
                             "errorType": type(error).__name__}
                  results.append(row)
                  if row["result"] != "PASS":
                      break
              return results

          def read_once(url, token):
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "crevux-pinned-source-preflight",
              })
              opener = urllib.request.build_opener(NoRedirect())
              try:
                  with opener.open(request, timeout=10) as response:
                      return response.status, response.headers, json.load(response)
              except urllib.error.HTTPError as error:
                  # Never log request headers, credential, private response bodies or URLs.
                  return error.code, error.headers, {}

          if __name__ == "__main__":
              results = verify(os.environ.get("SOURCE_READ_TOKEN", ""), read_once)
              print(json.dumps({"sourceReadPreflight": results, "automaticRetries": 0}))
              raise SystemExit(0 if len(results) == len(PINS) and all(r["result"] == "PASS" for r in results) else 1)

      - name: Checkout pinned XFlow proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          repository: craftyguru/xflowx
          ref: 7990e5cd2c271fb79aaeebc0887b62b776c10f0e
          path: apps/XFlow
          token: ${{ secrets.ECOSYSTEM_APP_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned Verixet proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          repository: craftyguru/verixet
          ref: cea5f5b74cc9f5f6d946e2e2fd33bb317b9fb20f
          path: apps/Verixet
          token: ${{ secrets.ECOSYSTEM_APP_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned RatAiFy proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          repository: craftyguru/Rataify
          ref: 9078e28ec3e19563fbf3754955d733083f8a2e82
          path: apps/RatAiFy
          token: ${{ secrets.ECOSYSTEM_APP_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned AudAiX proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          repository: craftyguru/AudAiX
          ref: 0c07ac6ecd8ba52172a6ce71a4a6f6d1e621f5a0
          path: apps/AudAiX
          token: ${{ secrets.ECOSYSTEM_APP_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned WordGeni proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          repository: craftyguru/WordGeni
          ref: d7ced489a249500d10f6e0b1a5bf988b39d8c05f
          path: apps/WordGeni
          token: ${{ secrets.ECOSYSTEM_APP_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned Crevux proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          repository: craftyguru/Crevux
          ref: 7b0a87ce6e360b9ee8142c028cea691be2095a46
          path: apps/Crevux
          token: ${{ secrets.ECOSYSTEM_APP_REPO_READ_TOKEN }}
          persist-credentials: false

      # Existing validators use both spellings on case-sensitive runners.
      # Alias immutable checkout directories; do not rename or omit source inputs.
      - name: Materialize legacy proof path aliases
        run: |
          test -d apps/AudAiX && test -d apps/Crevux
          test ! -e apps/AudAix && test ! -e apps/CreVux
          ln -s AudAiX apps/AudAix
          ln -s Crevux apps/CreVux

      - name: Run proof helper tests
        run: npm run test:proof-scanner

      - name: Validate ecosystem contract JSON
        run: node -e "JSON.parse(require('fs').readFileSync('ecosystem-contracts/routes.json','utf8')); JSON.parse(require('fs').readFileSync('ecosystem-contracts/env-contract.json','utf8')); console.log('contracts ok')"

      - name: Run public brand casing audit
        run: npm run public:brand-casing:audit

      - name: Run static ecosystem proof
        run: npm run proof:ecosystem:static

      - name: Upload proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-proof-static
          path: |
            output/phase17-ecosystem-proof-report.json
            output/phase17-ecosystem-proof-report.md
          if-no-files-found: warn

  protected-http-smoke:
    name: Protected HTTP smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_http_smoke
    environment: ${{ inputs.environment }}
    steps:
      - name: Refuse production HTTP smoke
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "HTTP smoke is disabled for production environments."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run protected non-mutating HTTP proof
        env:
          XFLOW_PROOF_BASE_URL: ${{ vars.XFLOW_PROOF_BASE_URL }}
          VERIXET_PROOF_BASE_URL: ${{ vars.VERIXET_PROOF_BASE_URL }}
          RATAIFY_PROOF_BASE_URL: ${{ vars.RATAIFY_PROOF_BASE_URL }}
          AUDAIX_PROOF_BASE_URL: ${{ vars.AUDAIX_PROOF_BASE_URL }}
          WORDGENI_PROOF_BASE_URL: ${{ vars.WORDGENI_PROOF_BASE_URL }}
          CREVUX_PROOF_BASE_URL: ${{ vars.CREVUX_PROOF_BASE_URL }}
          VERIXET_ECOSYSTEM_STATUS_SERVICE_TOKEN: ${{ secrets.VERIXET_ECOSYSTEM_STATUS_SERVICE_TOKEN }}
          VERIXET_PROOF_WORKSPACE_ID: ${{ vars.VERIXET_PROOF_WORKSPACE_ID }}
        run: npm run proof:ecosystem:http

      - name: Upload HTTP proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-proof-http-${{ inputs.environment }}
          path: |
            output/phase17-ecosystem-proof-report.json
            output/phase17-ecosystem-proof-report.md
          if-no-files-found: warn
